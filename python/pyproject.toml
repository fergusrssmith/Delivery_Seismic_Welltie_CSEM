[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pydelivery"
version = "0.1.0"
description = "Python port of Delivery: Bayesian trace-based seismic inversion with discrete fluid states and pinch-outs"
readme = "README.md"
license = { text = "GPL-2.0-or-later" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest"]
plot = ["matplotlib"]

[project.scripts]
pydelivery = "pydelivery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
